version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: fx

build:
  run_buildscript: false

images:
  - id: fx
    target: service
    service: fx-server
    source: docker.io/rikhuijzer/fx
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: fx
      source: https://github.com/rikhuijzer/fx
      source_author: rikhuijzer
  private:
    enabled: true
    skip_if_version_exists: true
    name: fx
    summary: 由 GitHub Actions 自动发布
