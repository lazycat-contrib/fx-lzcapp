application:
  subdomain: fx
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://fx-server:3000/
  injects:
    - id: login-autofill
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.login_user }}"
            password: "{{ .U.login_password }}"
services:
  fx-server:
    # docker.io/rikhuijzer/fx:0.1.2
    # upstream: docker.io/rikhuijzer/fx:1.6.2
    image: registry.lazycat.cloud/czyt/rikhuijzer/fx:bdf5338b58e16b2e
    environment:
      - FX_DOMAIN=${LAZYCAT_APP_DOMAIN}
      - FX_USERNAME={{ .U.login_user }}
      - FX_PASSWORD={{ .U.login_password }}
    binds:
      - /lzcapp/var/data:/data
