params:
  - id: login_user
    type: string
    name: Login User
    description: Administrator username
    default_value: admin

  - id: login_password
    type: secret
    name: Login Password
    description: Administrator password
    default_value: $random(len=20)

locales:
  zh:
    login_user:
      name: 登录用户
      description: 管理员用户名
    login_password:
      name: 登录密码
      description: 管理员密码
